worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location / {
            set $upstream_site http://workshop-site:3000;
            proxy_pass $upstream_site$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect ~^http://workshop-site:3000(/.*)$ http://$http_host$1;
        }

        location /unleash/ {
            set $upstream_unleash http://unleash:4242;
            proxy_pass $upstream_unleash;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /codapi/v1/ {
            set $upstream_codapi http://codapi-server:1313;
            rewrite ^/codapi/v1/(.*) /v1/$1 break;
            proxy_pass $upstream_codapi;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /app/ {
            set $upstream_app http://express-api:4000;
            rewrite ^/app/(.*) /$1 break;
            proxy_pass $upstream_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws/impressions {
            set $upstream_bus http://impression-bus:3001;
            proxy_pass $upstream_bus;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400s;
        }
    }
}

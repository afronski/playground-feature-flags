<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Lightbulb glass -->
  <circle cx="32" cy="24" r="16" fill="#FBBF24" stroke="#F59E0B" stroke-width="2"/>
  <!-- Glow -->
  <circle cx="32" cy="24" r="16" fill="url(#glow)" opacity="0.6"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Filament -->
  <path d="M28 20 Q32 28 36 20" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Base/screw -->
  <rect x="26" y="40" width="12" height="4" rx="1" fill="#9CA3AF"/>
  <rect x="27" y="44" width="10" height="3" rx="1" fill="#6B7280"/>
  <rect x="28" y="47" width="8" height="3" rx="1.5" fill="#6B7280"/>
  <!-- Neck connecting bulb to base -->
  <path d="M26 40 Q26 34 24 30" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <path d="M38 40 Q38 34 40 30" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <!-- Rays -->
  <line x1="32" y1="2" x2="32" y2="6" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="10" x2="17" y2="13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="10" x2="47" y2="13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="24" x2="12" y2="24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="24" x2="52" y2="24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
</svg>

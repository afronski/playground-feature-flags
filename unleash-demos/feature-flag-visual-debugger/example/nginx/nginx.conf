# NOTE: Nginx is NOT instrumented with OpenTelemetry (no otel-webserver-module).
# The official OTel C++ module requires a custom Docker build that adds significant
# complexity for minimal value (a single proxy_pass span). Instead, we forward
# W3C trace context headers (traceparent, tracestate, baggage) to preserve the
# trace chain from browser -> nginx -> backend.

upstream sample_app {
    server sample-app:3000;
}

upstream sample_api {
    server sample-api:8080;
}

upstream otel_collector {
    server otel-collector:4318;
}

server {
    listen 80;

    location / {
        proxy_pass http://sample_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
    }

    # Proxy browser OTel span export to the collector (same-origin, avoids CORS)
    location /otel/ {
        proxy_pass http://otel_collector/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://sample_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
    }
}

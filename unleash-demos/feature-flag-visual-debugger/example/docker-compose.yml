services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d unleash -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  unleash:
    image: unleashorg/unleash-server
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: unleash
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSL: "false"
      INIT_BACKEND_API_TOKENS: "default:development.unleash-insecure-backend-api-token"
      INIT_FRONTEND_API_TOKENS: "default:development.unleash-insecure-frontend-api-token"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    ports:
      - "4242:4242"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4242/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  unleash-init:
    image: curlimages/curl:latest
    depends_on:
      unleash:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/unleash-seed.sh"]
    volumes:
      - ./init/unleash-seed.sh:/scripts/unleash-seed.sh:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_healthy

  sample-api:
    build: ./sample-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sampleapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: sample-api
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_JAVA_EXPERIMENTAL_SPAN_ATTRIBUTES_COPY_FROM_BAGGAGE: "session.id"
      UNLEASH_API_URL: http://unleash:4242/api
      UNLEASH_API_TOKEN: "default:development.unleash-insecure-backend-api-token"
    depends_on:
      postgres:
        condition: service_healthy
      unleash:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/lightbulb"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  sample-app:
    build: ./sample-app
    ports:
      - "3000:3000"
    depends_on:
      sample-api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      sample-app:
        condition: service_started
      sample-api:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  pgdata:
